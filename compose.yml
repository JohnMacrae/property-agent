services:

  agent:
    build: ./agent
    container_name: property-agent
    restart: always
    ports:
      - "3005:3001"
    volumes:
      - ./flags:/flags
      - ./logs:/logs
      - ./output:/output
      - ./data:/data
      - ./properties.txt:/agent/properties.txt:ro
      - ./property-aliases.json:/agent/property-aliases.json:ro
      - ./rates.json:/agent/rates.json:ro
      - /volume1/docker/property_details/JJP_Property_List.md:/agent/JJP_Property_List.md:ro
      - ./agent-system-prompt.md:/agent/agent-system-prompt.md:ro
      - /volume1/docker/gmail-mcp/config/jramacrae:/gmail-config:ro
      - /volume1/docker/property_details:/property_details:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GMAIL_TOKEN_PATH=/gmail-config/token.json
      - GMAIL_SCOPE_TIER=readonly
      - LLM_BACKEND=${LLM_BACKEND:-openrouter}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://shack.beetal-carp.ts.net:11434}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-google/gemini-2.5-flash}
      - AGENT_MODEL_FALLBACK=${AGENT_MODEL_FALLBACK:-}
      - COMMAND_TOKEN=${COMMAND_TOKEN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GOOGLE_REFRESH_TOKEN_FILE=/gmail-config/calendar-refresh-token
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
      - FREEAGENT_CLIENT_ID=${FREEAGENT_CLIENT_ID}
      - FREEAGENT_CLIENT_SECRET=${FREEAGENT_CLIENT_SECRET}
      - FREEAGENT_REFRESH_TOKEN=${FREEAGENT_REFRESH_TOKEN}
      - FREEAGENT_CONTACT_URL=${FREEAGENT_CONTACT_URL}
      - TZ=Europe/London
      - FLAGS_DIR=/flags
      - LOGS_DIR=/logs
      - AGENT_DIR=/agent
      - DATA_DIR=/data
      - WORK_ORDERS_DIR=/output/work_orders
      # Watchdog thresholds
      - WARN_SESSIONS_PER_HOUR=4
      - PAUSE_SESSIONS_PER_HOUR=6
      - KILL_SESSIONS_PER_HOUR=8
      - WARN_SESSION_TOKENS=40000
      - KILL_SESSION_TOKENS=60000
    networks:
      - agent-net

networks:
  agent-net:
    external: true
